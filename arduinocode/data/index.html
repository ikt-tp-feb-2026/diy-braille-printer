<!DOCTYPE HTML>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Принтер шрифта Брайля</title>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 id="pageTitle">Принтер Брайля</h1>
      
      <a href="https://tp-feb-2026.web.app/" target="_blank" class="project-link" title="Сайт проекта">
        <span class="link-text">Сайт проекта</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </div>
  </header>

  <div id="printerView" class="container">
    <div class="panel">
      <h3>Ввод текста</h3>
      <textarea id="inputText" placeholder="Введите текст здесь..."></textarea>
      <button class="btn btn-blue" onclick="renderBraille()">Предпросмотр</button>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 15px; text-align: center;">Поддерживается кириллица, цифры и знаки препинания.</p>
    </div>

    <div class="panel">
      <h3>Предпросмотр</h3>
      <div class="paper-wrapper">
        <div id="paper" class="paper-a4"></div>
      </div>
      <div class="action-row">
          <button class="btn btn-green flex-grow" onclick="sendPrint()">ОТПРАВИТЬ НА ПЕЧАТЬ</button>
          <button class="btn-settings" onclick="openSettings()">⚙️</button>
      </div>
      
      <div id="status">Готов к работе</div>
    </div>
  </div>

  <div id="debugView" class="container hidden">
    <div class="panel debug-panel-wrapper">
      <h3 style="color: var(--apple-red);">🛠 Debug Mode</h3>
      
      <div class="control-group">
          <p style="margin-bottom: 15px; font-weight: 600;">Сервопривод</p>
          <div style="margin-bottom: 15px;">
            <label for="servoAngle" class="label-small">Угол (0° - 180°):</label>
            <input type="number" id="servoAngle" min="0" max="180" value="90" placeholder="90">
          </div>
          <button class="btn btn-red" onclick="sendServo()">ПОВЕРНУТЬ СЕРВО</button>
      </div>

      <div class="control-group">
        <p style="margin-bottom: 15px; font-weight: 600;">Шаговый двигатель</p>
        
        <label for="stepperSteps" class="label-small">Количество шагов:</label>
        <input type="number" id="stepperSteps" min="1" value="100" placeholder="Например: 200">

        <label class="label-small" style="margin-top: 15px;">Направление:</label>
        <div class="segmented-control">
            <div class="segment-option selected" onclick="setStepperDir('cw', this)">По часовой</div>
            <div class="segment-option" onclick="setStepperDir('ccw', this)">Против</div>
        </div>

        <button class="btn btn-orange" onclick="sendStepper()">ВРАЩАТЬ ШАГОВИК</button>
      </div>
      
      <div id="debug-status">Ожидание команды...</div>
    </div>
  </div>

  <div class="mode-switcher">
    <span class="mode-label active" id="labelPrinter">Printer Mode</span>
    <label class="switch">
      <input type="checkbox" id="modeToggle" onchange="toggleMode(this)">
      <span class="slider"></span>
    </label>
    <span class="mode-label" id="labelDebug">Debug Mode</span>
  </div>
  <div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">⚙️ Калибровка</h3>
        
        <div class="setting-group">
            <label>Серво: Удар (низ, 0-180)</label>
            <input type="number" id="cfg_a_down">
        </div>
        <div class="setting-group">
            <label>Серво: Подъем (верх, 0-180)</label>
            <input type="number" id="cfg_a_up">
        </div>

        <hr style="border:0; border-top:1px dashed #ddd; margin: 15px 0;">

        <div class="setting-group">
           <label>Направление протяжки</label>
           <select id="cfg_feed_dir" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
               <option value="1">По часовой (HIGH / CW)</option>
               <option value="0">Против часовой (LOW / CCW)</option>
           </select>
        </div>
        <div class="setting-group">
            <label>Шаги на новую строку (New Line)</label>
            <input type="number" id="cfg_s_new">
        </div>
        <div class="setting-group">
            <label>Шаги между точками (Row Gap)</label>
            <input type="number" id="cfg_s_row">
        </div>
        <div class="setting-group">
            <label>Символов в строке (Limit)</label>
            <input type="number" id="cfg_c_line"> </div>

        <hr style="border:0; border-top:1px dashed #ddd; margin: 15px 0;">

        <div class="setting-group">
            <label>Задержка точки (мс)</label>
            <input type="number" id="cfg_t_dot">
        </div>
        <div class="setting-group">
            <label>Задержка между буквами (мс)</label>
            <input type="number" id="cfg_t_char"> </div>
        <div class="setting-group">
           <label>Задержка возврата каретки (мс)</label>
           <input type="number" id="cfg_t_ret">
       </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeSettings()">Отмена</button>
            <button class="btn-save" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
